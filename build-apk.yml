
name: Build Doot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create --platforms=android,ios,web,windows,macos .

      - name: Set Android SDK 36
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          changed = False

          for path in files:
              if not path.is_file():
                  continue

              text = path.read_text()
              updated = re.sub(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)(\s*)$',
                  r'\g<1>36\g<2>',
                  text,
              )

              if updated != text:
                  path.write_text(updated)
                  changed = True

              if re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', updated):
                  print(f"Verified app SDK 36: {path}")
                  changed = True

          if not changed:
              raise SystemExit("ERROR: Could not verify Android app compileSdk 36")
          PY

      - name: Prepare Doot source
        shell: bash
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart
          cp firebase_options.dart lib/firebase_options.dart

          sed -i \
            "s/web.apiKey/'AIzaSyA0cx3zs7ronUP_Nh1d-H-ZjVfDGrECMI_g'/g; \
             s/web.messagingSenderId/'771238210735'/g; \
             s/web.projectId/'doot-delivery'/g; \
             s/web.storageBucket/'doot-delivery.firebasestorage.app'/g" \
            lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Update Android plugin SDKs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.environ["HOME"]) / ".pub-cache" / "hosted" / "pub.dev"
          targets = ("file_picker-", "flutter_plugin_android_lifecycle-")
          found = []

          if root.exists():
              for package in root.iterdir():
                  if not package.is_dir() or not package.name.startswith(targets):
                      continue

                  for filename in ("build.gradle", "build.gradle.kts"):
                      path = package / "android" / filename
                      if not path.is_file():
                          continue

                      text = path.read_text()
                      updated = re.sub(
                          r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)(\s*)$',
                          r'\g<1>36\g<2>',
                          text,
                      )

                      if updated != text:
                          path.write_text(updated)
                          print(f"Updated plugin SDK: {path}")

                      if re.search(
                          r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$',
                          updated,
                      ):
                          found.append(package.name)

          if not found:
              raise SystemExit(
                  "ERROR: Could not verify SDK 36 in file_picker or "
                  "flutter_plugin_android_lifecycle. Inspect plugin Gradle files."
              )

          print("Verified SDK 36 for: " + ", ".join(sorted(set(found))))
          PY

      - name: Check Flutter source
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doot-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
