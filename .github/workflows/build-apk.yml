
name: Build Doot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter platforms
        run: flutter create --platforms=android,ios,web,windows,macos .

      - name: Prepare application source
        shell: bash
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart
          cp firebase_options.dart lib/firebase_options.dart

      - name: Configure Android SDK
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "Android Gradle file not found"
            exit 1
          fi

          touch android/gradle.properties
          grep -q '^org.gradle.vfs.watch=false$' android/gradle.properties || \
            echo 'org.gradle.vfs.watch=false' >> android/gradle.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Firebase API key
        shell: bash
        run: |
          grep -q "apiKey: 'AIzaSyA0cx3zs7ronUP_Nh1dH-ZjVfDGrECMI_g'" lib/firebase_options.dart || {
            echo "Firebase API key does not match the expected key."
            exit 1
          }

      - name: Update plugin compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if not root.exists():
              raise SystemExit("Pub cache not found")

          for p in root.glob("*/android/build.gradle*"):
              try:
                  content = p.read_text()
                  content = re.sub(
                      r'(compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                      r'\g<1>36',
                      content
                  )
                  p.write_text(content)
              except (OSError, UnicodeError):
                  pass

          print("Plugin compile SDK update completed.")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doot-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
