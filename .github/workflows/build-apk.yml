name: Build Doot Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create --platforms=android,ios,web,windows,macos .

      - name: Prepare Doot source
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart
          cp firebase_options.dart lib/firebase_options.dart
          sed -i "s/web.apiKey/'AIzaSyA0cx3zs7ronUP_Nh1d-H-ZjVfDGrECMI_g'/g; s/web.messagingSenderId/'771238210735'/g; s/web.projectId/'doot-delivery'/g; s/web.storageBucket/'doot-delivery.firebasestorage.app'/g" lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doot-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
